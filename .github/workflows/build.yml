name: Build

on:
  push:
    branches: [master]
    # The Android app is built and released by android.yml
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CMake fetches and builds wxWidgets into build\; keep it between runs.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-${{ runner.os }}-

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Package
        id: artifact
        shell: pwsh
        run: |
          $version = (Select-String -Path src/version.h -Pattern '#define APP_VERSION "(.+)"').Matches[0].Groups[1].Value
          # The updater unpacks the zip and copies its FastGH folder over the program.
          New-Item -ItemType Directory -Force -Path dist/FastGH | Out-Null
          Copy-Item build/out/Release/FastGH.exe dist/FastGH/
          $zip = "FastGH-$version-Windows.zip"
          Compress-Archive -Path dist/FastGH -DestinationPath $zip
          echo "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.artifact.outputs.path }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-${{ runner.os }}-

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Sign and make the disk image
        id: artifact
        run: |
          VERSION=$(sed -n 's/#define APP_VERSION "\(.*\)"/\1/p' src/version.h)
          codesign --force --deep --sign - build/FastGH.app
          mkdir -p dmg
          cp -R build/FastGH.app dmg/
          ln -s /Applications dmg/Applications
          DMG="FastGH-$VERSION.dmg"
          hdiutil create -volname FastGH -srcfolder dmg -ov -format UDZO "$DMG"
          echo "path=$DMG" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.artifact.outputs.path }}

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          version=$(sed -n 's/#define APP_VERSION "\(.*\)"/\1/p' src/version.h)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      # The Android APK is built by android.yml, only when the app's code changes:
      # the one on the release now goes on the new one.
      - name: Keep the Android APK
        run: gh release download latest -p FastGH.apk -D artifacts/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}

            **Version:** ${{ steps.version.outputs.version }}
            **Built:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.event.head_commit.message }}

            This release is automatically updated on every commit to master.

            ## Downloads
            - **Windows:** FastGH-${{ steps.version.outputs.version }}-Windows.zip
            - **macOS:** FastGH-${{ steps.version.outputs.version }}.dmg
            - **Android:** FastGH.apk (Android 8 or later)
          files: artifacts/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
